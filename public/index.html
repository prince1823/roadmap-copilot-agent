<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roadmap Copilot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-2: #1a1a26;
      --border: #2a2a3a;
      --border-hover: #3a3a5a;
      --text: #e4e4ef;
      --text-dim: #8888a0;
      --accent: #6c5ce7;
      --accent-glow: rgba(108, 92, 231, 0.3);
      --green: #00d2a0;
      --green-dim: rgba(0, 210, 160, 0.15);
      --red: #ff6b6b;
      --red-dim: rgba(255, 107, 107, 0.15);
      --yellow: #ffd93d;
      --yellow-dim: rgba(255, 217, 61, 0.12);
      --blue: #4ecdc4;
      --blue-dim: rgba(78, 205, 196, 0.12);
      --radius: 12px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 32px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--text), var(--text-dim));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header h1 span {
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: var(--green-dim);
      border: 1px solid rgba(0, 210, 160, 0.3);
      border-radius: 20px;
      font-size: 12px;
      color: var(--green);
      font-weight: 500;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ── Layout ── */
    .main {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; }
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .card-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-header h2 {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-dim);
    }

    .card-body {
      padding: 20px;
    }

    /* ── Chat ── */
    .chat-messages {
      height: 420px;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-track { background: transparent; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.65;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .msg.assistant {
      align-self: flex-start;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg.system {
      align-self: center;
      background: var(--yellow-dim);
      border: 1px solid rgba(255, 217, 61, 0.2);
      color: var(--yellow);
      font-size: 12px;
      text-align: center;
      max-width: 100%;
    }

    .msg.error {
      align-self: center;
      background: var(--red-dim);
      border: 1px solid rgba(255, 107, 107, 0.2);
      color: var(--red);
      font-size: 12px;
    }

    .chat-input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
    }

    .chat-input {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .chat-input::placeholder { color: var(--text-dim); }

    .send-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .send-btn:hover { background: #5a4bd6; transform: translateY(-1px); }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .send-btn .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Right panel ── */
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ── Steps timeline ── */
    .steps-list {
      max-height: 250px;
      overflow-y: auto;
      padding: 0 20px 20px;
    }

    .step-item {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      animation: fadeIn 0.3s ease;
    }

    .step-item:last-child { border-bottom: none; }

    .step-num {
      width: 26px;
      height: 26px;
      background: var(--accent-glow);
      border: 1px solid var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
      margin-top: 2px;
    }

    .step-info { flex: 1; min-width: 0; }

    .step-tool {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .step-tool .tool-badge {
      font-size: 10px;
      padding: 2px 7px;
      background: var(--blue-dim);
      color: var(--blue);
      border-radius: 4px;
      font-weight: 500;
    }

    .step-summary {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ── Stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 20px 20px;
    }

    .stat-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 700;
    }

    .stat-value.green { color: var(--green); }
    .stat-value.red { color: var(--red); }
    .stat-value.accent { color: var(--accent); }
    .stat-value.blue { color: var(--blue); }

    /* ── Empty states ── */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 160px;
      color: var(--text-dim);
      font-size: 13px;
      gap: 8px;
    }

    .empty-icon { font-size: 32px; opacity: 0.4; }

    /* ── Settings row ── */
    .settings {
      display: flex;
      gap: 12px;
      padding: 0 20px 16px;
      flex-wrap: wrap;
    }

    .setting {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 100px;
    }

    .setting label {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .setting input {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--text);
      font-size: 13px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      outline: none;
      width: 100%;
    }

    .setting input:focus {
      border-color: var(--accent);
    }

    /* ── Markdown-like rendering ── */
    .msg h3 { font-size: 14px; margin: 10px 0 4px; font-weight: 600; }
    .msg ul, .msg ol { padding-left: 18px; margin: 4px 0; }
    .msg li { margin: 2px 0; }
    .msg strong { font-weight: 600; }
    .msg code { background: rgba(255,255,255,0.1); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">&#x1F9ED;</div>
        <h1>Roadmap <span>Copilot</span></h1>
      </div>
      <div class="status-badge" id="statusBadge">
        <div class="status-dot"></div>
        <span>Connected</span>
      </div>
    </header>

    <!-- Main layout -->
    <div class="main">
      <!-- Left: Chat -->
      <div class="card">
        <div class="card-header">
          <h2>Chat</h2>
          <button onclick="resetChat()" style="background:none;border:1px solid var(--border);border-radius:6px;padding:4px 12px;color:var(--text-dim);cursor:pointer;font-size:12px;">Reset</button>
        </div>
        <div class="chat-messages" id="chatMessages">
          <div class="msg system">Ask the copilot to view or update your MLOps roadmap. Try: "Update month 3 with better CI/CD goals and save it."</div>
        </div>
        <div class="settings">
          <div class="setting">
            <label>Token Budget</label>
            <input type="number" id="tokenBudget" value="4096" min="256" />
          </div>
          <div class="setting">
            <label>Max Steps</label>
            <input type="number" id="maxSteps" value="10" min="1" max="20" />
          </div>
        </div>
        <div class="chat-input-area">
          <input type="text" class="chat-input" id="chatInput" placeholder="Ask about your roadmap..." />
          <button class="send-btn" id="sendBtn" onclick="sendMessage()">
            Send
          </button>
        </div>
      </div>

      <!-- Right: Agent details -->
      <div class="right-panel">
        <!-- Stats -->
        <div class="card">
          <div class="card-header"><h2>Run Stats</h2></div>
          <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
              <div class="stat-label">Status</div>
              <div class="stat-value" id="statStatus" style="font-size:14px;color:var(--text-dim)">Idle</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Steps</div>
              <div class="stat-value accent" id="statSteps">-</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Roadmap Updated</div>
              <div class="stat-value" id="statUpdated" style="font-size:14px;color:var(--text-dim)">-</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Model</div>
              <div class="stat-value blue" id="statModel" style="font-size:12px">-</div>
            </div>
          </div>
        </div>

        <!-- Steps timeline -->
        <div class="card">
          <div class="card-header"><h2>Agent Steps</h2></div>
          <div class="steps-list" id="stepsList">
            <div class="empty">
              <div class="empty-icon">&#x1F916;</div>
              <div>Agent steps will appear here</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const stepsList = document.getElementById('stepsList');

    let sessionHistory = [];

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      // Simple markdown rendering
      div.innerHTML = text
        .replace(/### (.+)/g, '<h3>$1</h3>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`(.+?)`/g, '<code>$1</code>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>')
        .replace(/\n/g, '<br>');
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function renderSteps(steps) {
      if (!steps || steps.length === 0) return;
      stepsList.innerHTML = '';
      steps.forEach((s) => {
        const item = document.createElement('div');
        item.className = 'step-item';
        const toolName = s.tool || s.action;
        const badge = s.tool ? `<span class="tool-badge">${s.tool}</span>` : '';
        item.innerHTML = `
          <div class="step-num">${s.step}</div>
          <div class="step-info">
            <div class="step-tool">${s.action} ${badge}</div>
            <div class="step-summary">${s.result_summary || ''}</div>
          </div>
        `;
        stepsList.appendChild(item);
      });
    }

    function updateStats(data) {
      const el = (id) => document.getElementById(id);
      if (data.success) {
        el('statStatus').textContent = 'Success';
        el('statStatus').style.color = 'var(--green)';
      } else {
        el('statStatus').textContent = 'Failed';
        el('statStatus').style.color = 'var(--red)';
      }
      el('statSteps').textContent = data.steps ? data.steps.length : '-';
      el('statUpdated').textContent = data.roadmap_updated ? 'Yes' : 'No';
      el('statUpdated').style.color = data.roadmap_updated ? 'var(--green)' : 'var(--text-dim)';
      el('statModel').textContent = data.model || '-';
    }

    function setLoading(on) {
      sendBtn.disabled = on;
      chatInput.disabled = on;
      sendBtn.innerHTML = on
        ? '<div class="spinner"></div> Running...'
        : 'Send';
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      chatInput.value = '';
      addMessage('user', text);
      setLoading(true);

      const tokenBudget = parseInt(document.getElementById('tokenBudget').value) || 4096;
      const maxSteps = parseInt(document.getElementById('maxSteps').value) || 10;

      const body = {
        user_message: text,
        session_history: sessionHistory,
        token_budget_per_model_call: tokenBudget,
        max_steps: maxSteps,
      };

      try {
        const res = await fetch('/ai/roadmap-copilot/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });

        const data = await res.json();

        if (data.final_message) {
          addMessage('assistant', data.final_message);
          sessionHistory.push({ role: 'user', content: text });
          sessionHistory.push({ role: 'assistant', content: data.final_message });
        } else if (data.error) {
          addMessage('error', `Error: ${data.error}`);
        }

        renderSteps(data.steps);
        updateStats(data);
      } catch (err) {
        addMessage('error', `Network error: ${err.message}`);
      } finally {
        setLoading(false);
        chatInput.focus();
      }
    }

    function resetChat() {
      sessionHistory = [];
      chatMessages.innerHTML = '<div class="msg system">Chat reset. Ask the copilot to view or update your MLOps roadmap.</div>';
      stepsList.innerHTML = '<div class="empty"><div class="empty-icon">&#x1F916;</div><div>Agent steps will appear here</div></div>';
      document.getElementById('statStatus').textContent = 'Idle';
      document.getElementById('statStatus').style.color = 'var(--text-dim)';
      document.getElementById('statSteps').textContent = '-';
      document.getElementById('statUpdated').textContent = '-';
      document.getElementById('statUpdated').style.color = 'var(--text-dim)';
      document.getElementById('statModel').textContent = '-';
    }

    // Check health on load
    fetch('/health').then(r => r.json()).then(() => {
      document.getElementById('statusBadge').querySelector('span').textContent = 'Connected';
    }).catch(() => {
      const badge = document.getElementById('statusBadge');
      badge.style.background = 'var(--red-dim)';
      badge.style.borderColor = 'rgba(255,107,107,0.3)';
      badge.querySelector('.status-dot').style.background = 'var(--red)';
      badge.querySelector('span').textContent = 'Disconnected';
      badge.querySelector('span').style.color = 'var(--red)';
    });
  </script>
</body>
</html>
